<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longevity Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scrollbar-gutter: stable;
        }
        .dropdown-menu {
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            pointer-events: none;
            transition: opacity 150ms cubic-bezier(0.4, 0, 0.2, 1), transform 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dropdown-menu.open {
            opacity: 1;
            transform: scaleY(1);
            pointer-events: auto;
        }
        .editable-cell:focus {
            background-color: rgba(2, 6, 23, 0.9);
            outline: 2px solid #0891b2;
            border-radius: 4px;
            padding-left: 8px;
            padding-right: 8px;
        }
    </style>
</head>
<body class="bg-[#05070c] text-slate-300 min-h-screen antialiased selection:bg-cyan-600 selection:text-slate-200 font-mono">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 text-slate-300 relative">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-slate-900 border border-cyan-800/60 flex items-center justify-center text-cyan-400 shadow-md shrink-0">
                    <svg class="w-7 h-7 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-slate-200 tracking-tight font-mono">Longevity Database</h1>
                    <p class="text-slate-400 text-xs sm:text-sm font-mono tracking-wide">LIVE LONGEVITY TRACKER (ALIVE / DECEASED / LIMBO)</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <button type="button" id="load-sheet-btn" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-400 px-3 py-1.5 rounded-lg text-xs font-mono transition-colors cursor-pointer">
                    + Add Sheet Entries
                </button>
                <button type="button" id="purge-all-btn" class="bg-red-950/40 hover:bg-red-900/40 border border-red-900/30 text-red-400 px-3 py-1.5 rounded-lg text-xs font-mono transition-colors cursor-pointer">
                    Purge All
                </button>
                <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg flex items-center space-x-3 text-xs font-mono shadow-sm">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
                        <span class="text-slate-400">Total:</span>
                        <span id="live-count-badge" class="text-slate-200 font-bold">0</span>
                    </div>
                    <span class="text-slate-700">|</span>
                    <div class="flex items-center space-x-1">
                        <span class="text-emerald-400">Alive:</span>
                        <span id="alive-count-badge" class="text-slate-200 font-bold">0</span>
                    </div>
                    <span class="text-slate-700">|</span>
                    <div class="flex items-center space-x-1">
                        <span class="text-amber-400">Limbo:</span>
                        <span id="limbo-count-badge" class="text-slate-200 font-bold">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Entry Form -->
        <div class="bg-slate-900/90 p-4 sm:p-6 rounded-lg shadow-xl border border-slate-800 mb-6">
            <h2 class="text-lg font-bold text-slate-200 mb-5 tracking-wide font-mono border-b border-slate-800 pb-2">Add Entry</h2>
            
            <div class="space-y-5">
                <!-- Row 1: Name & Gender -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4 items-end">
                    <div class="lg:col-span-4">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1 tracking-wider">First Name / Title <span class="text-red-400">*</span></label>
                        <input type="text" id="form-first-name" placeholder="Click to Type" class="w-full h-10 bg-slate-950/60 border border-slate-800 rounded p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-600 font-mono">
                    </div>
                    <div class="lg:col-span-3">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Middle Name(s) <span class="text-slate-500 font-normal lowercase">(optional)</span></label>
                        <input type="text" id="form-middle-name" placeholder="Click to Type" class="w-full h-10 bg-slate-950/60 border border-slate-800 rounded p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-600 font-mono">
                    </div>
                    <div class="lg:col-span-3">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Last Name <span class="text-red-400">*</span></label>
                        <input type="text" id="form-last-name" placeholder="Click to Type" class="w-full h-10 bg-slate-950/60 border border-slate-800 rounded p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-600 font-mono">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Gender <span class="text-red-400">*</span></label>
                        <div class="flex items-center space-x-1 bg-slate-950/60 p-1 rounded h-10 border border-slate-800">
                            <button type="button" id="gender-f" class="flex-1 h-full text-[11px] font-bold rounded bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">F</button>
                            <button type="button" id="gender-m" class="flex-1 h-full text-[11px] font-bold rounded bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">M</button>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Birth, Death, Status/Limbo, Submit -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4 items-start pt-1">
                    <!-- Birth Date -->
                    <div class="lg:col-span-3 space-y-1">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Birth Date <span class="text-red-400">*</span></label>
                        <input type="text" id="form-birth-date" placeholder="Click to Type" class="w-full h-10 bg-slate-950/60 border border-slate-800 rounded p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-600 font-mono">
                        <p id="birth-preview" class="text-[11px] text-red-400 font-mono italic h-4"></p>
                    </div>
                    <!-- Death Date / Unverified -->
                    <div class="lg:col-span-3 space-y-1">
                        <div class="flex justify-between items-center">
                            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Death Date</label>
                            <button type="button" id="set-unverified-btn" class="text-[10px] text-amber-400 hover:text-amber-300 underline cursor-pointer">Mark Unverified (Limbo)</button>
                        </div>
                        <input type="text" id="form-death-date" placeholder="Click to Type" class="w-full h-10 bg-slate-950/60 border border-slate-800 rounded p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-600 font-mono">
                        <p id="death-preview" class="text-[11px] text-slate-500 font-mono italic h-4">Alive</p>
                    </div>
                    <!-- Last Verified (If Limbo) -->
                    <div class="lg:col-span-3 space-y-1">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">If "Limbo", Last Verified</label>
                        <input type="text" id="form-last-verified" placeholder="Click to Type" class="w-full h-10 bg-slate-950/60 border border-slate-800 rounded p-2.5 text-slate-200 text-xs focus:outline-none focus:border-cyan-600 font-mono">
                        <p class="text-[10px] text-slate-500 font-mono h-4">For Limbo</p>
                    </div>
                    <!-- Submit Button -->
                    <div class="lg:col-span-3 pt-5">
                        <button type="button" id="submit-btn" disabled class="w-full bg-slate-800 text-slate-600 font-semibold py-2 px-4 rounded transition-colors duration-75 shadow-none cursor-not-allowed text-xs h-10 font-mono tracking-wider uppercase">Add to Database</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls: Find in List & Sort Data (Sticky Top Bar) -->
        <div id="controls-wrapper" class="sticky top-0 z-30 bg-[#05070c]/95 backdrop-blur-sm p-3 sm:p-4 rounded-b-lg border border-slate-800 mb-4 hidden flex-col md:flex-row justify-between items-stretch md:items-center gap-3 shadow-xl">
            <!-- Find in List -->
            <div class="relative flex-1 max-w-md">
                <input type="text" id="search-input" placeholder="Find in List (search name, year, status)..." class="w-full h-9 bg-slate-950/80 border border-slate-800 rounded pl-3 pr-8 text-xs text-slate-200 focus:outline-none focus:border-cyan-600 font-mono">
                <button type="button" id="clear-search-btn" class="hidden absolute right-2.5 top-2 text-slate-500 hover:text-slate-300 text-xs">✕</button>
            </div>
            <!-- Status Filter & Sort Data -->
            <div class="flex flex-wrap items-center gap-2">
                <div class="flex items-center bg-slate-950/80 border border-slate-800 rounded p-0.5 text-[11px]">
                    <button type="button" data-filter="ALL" class="filter-btn px-2.5 py-1 rounded bg-cyan-900/60 text-cyan-200 font-bold">All</button>
                    <button type="button" data-filter="Alive" class="filter-btn px-2.5 py-1 rounded text-slate-400 hover:text-slate-200">Alive</button>
                    <button type="button" data-filter="Deceased" class="filter-btn px-2.5 py-1 rounded text-slate-400 hover:text-slate-200">Deceased</button>
                    <button type="button" data-filter="Limbo" class="filter-btn px-2.5 py-1 rounded text-slate-400 hover:text-slate-200">Limbo</button>
                </div>
                <select id="sort-select" class="h-9 bg-slate-950/80 border border-slate-800 rounded px-2.5 text-xs text-slate-300 focus:outline-none focus:border-cyan-600 font-mono cursor-pointer">
                    <option value="birth-asc">Oldest -> Youngest</option>
                    <option value="birth-desc">Youngest -> Oldest</option>
                    <option value="name-asc">Alphabetically</option>
                </select>
            </div>
        </div>

        <!-- Data Table -->
        <div id="table-wrapper" class="bg-slate-900 rounded-lg shadow-xl border border-slate-800 hidden">
            <table class="min-w-full divide-y divide-slate-800 text-left text-xs sm:text-sm font-mono">
                <thead id="table-header" style="top: var(--controls-height, 68px);" class="sticky z-20 bg-slate-950 text-slate-400 uppercase text-[10px] sm:text-xs font-semibold tracking-wider shadow-md">
                    <tr>
                        <th class="w-[24%] px-4 py-3.5 text-center border-r border-slate-800/80 rounded-tl-lg">Name</th>
                        <th class="w-[8%] px-2 py-3.5 text-center border-r border-slate-800/80">Gender</th>
                        <th class="w-[15%] px-4 py-3.5 text-center border-r border-slate-800/80">Birth</th>
                        <th class="w-[15%] px-4 py-3.5 text-center border-r border-slate-800/80">Death</th>
                        <th class="w-[15%] px-4 py-3.5 text-center border-r border-slate-800/80">Age</th>
                        <th class="w-[10%] px-3 py-3.5 text-center border-r border-slate-800/80">Status</th>
                        <th class="w-[13%] px-4 py-3.5 text-center border-r border-slate-800/80">If "Limbo", Last Verified</th>
                        <th class="w-[8%] px-3 py-3.5 text-center rounded-tr-lg">Action</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-800 bg-slate-950/20"></tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'longevity_database_v13';
        const GOOGLE_SHEET_ID = '10WPFH-kWmToIx4XMjdwGf9yiAfeuBxLTEELCcnHwjEs';
        const GOOGLE_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("People's Ages")}`;

        let peopleDataMap = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        let activeGender = "";
        let openDropdownKey = null;
        let activelyEditingKey = null;
        let currentFilter = "ALL";
        let currentSort = "birth-asc";
        let searchQuery = "";

        const submitBtnEnabledClass = "w-full bg-cyan-800 hover:bg-cyan-700 text-slate-200 font-semibold py-2 px-4 rounded transition-colors duration-75 shadow-sm cursor-pointer text-xs h-10 font-mono tracking-wider uppercase";
        const submitBtnDisabledClass = "w-full bg-slate-800 text-slate-600 font-semibold py-2 px-4 rounded transition-colors duration-75 shadow-none cursor-not-allowed text-xs h-10 font-mono tracking-wider uppercase";
        const btnActiveStyle = "flex-1 h-full text-[11px] font-bold rounded bg-cyan-800 text-slate-200 transition-colors shadow-sm";
        const btnInactiveStyle = "flex-1 h-full text-[11px] font-bold rounded bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors";

        const monthMap = {
            'january': 0, 'jan': 0, 'januery': 0,
            'february': 1, 'feb': 1, 'febuary': 1, 'febrary': 1,
            'march': 2, 'mar': 2,
            'april': 3, 'apr': 3,
            'may': 4,
            'june': 5, 'jun': 5,
            'july': 6, 'jul': 6,
            'august': 7, 'aug': 7,
            'september': 8, 'sep': 8, 'sept': 8,
            'october': 9, 'oct': 9,
            'november': 10, 'nov': 10,
            'december': 11, 'dec': 11
        };

        function parseHistoricalDate(rawText) {
            if (!rawText) return null;
            let str = rawText.trim();
            if (!str) return null;

            // Handle ISO YYYY-MM-DD format (returned by Google Sheets CSV export)
            const isoMatch = str.match(/^(\d{1,4})-(\d{1,2})-(\d{1,2})$/);
            if (isoMatch) {
                const y = parseInt(isoMatch[1], 10);
                const m = parseInt(isoMatch[2], 10) - 1;
                const d = parseInt(isoMatch[3], 10);
                if (m < 0 || m > 11 || d < 1 || d > 31) return null;
                const dt = new Date(0);
                dt.setFullYear(y, m, d);
                dt.setHours(0, 0, 0, 0);
                if (dt.getMonth() !== m) return null;
                return { date: dt, isMonthOnly: false };
            }

            // Handle M/D/YYYY format
            const slashMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{1,4})$/);
            if (slashMatch) {
                const m = parseInt(slashMatch[1], 10) - 1;
                const d = parseInt(slashMatch[2], 10);
                const y = parseInt(slashMatch[3], 10);
                if (m < 0 || m > 11 || d < 1 || d > 31) return null;
                const dt = new Date(0);
                dt.setFullYear(y, m, d);
                dt.setHours(0, 0, 0, 0);
                if (dt.getMonth() !== m) return null;
                return { date: dt, isMonthOnly: false };
            }

            // Handle "Month YYYY" format
            const monthYearMatch = str.toLowerCase().replace(/,/g, '').match(/^([a-z]+)\s+(\d{1,4})$/);
            if (monthYearMatch && monthMap.hasOwnProperty(monthYearMatch[1])) {
                const m = monthMap[monthYearMatch[1]];
                const y = parseInt(monthYearMatch[2], 10);
                const dt = new Date(0);
                dt.setFullYear(y, m, 1);
                dt.setHours(0, 0, 0, 0);
                return { date: dt, isMonthOnly: true };
            }

            // Handle "Month D, YYYY" or "D Month YYYY"
            let cleaned = str.toLowerCase().replace(/(\b\d+)(st|nd|rd|th)\b/g, '$1').replace(/\bof\b/g, ' ').replace(/,/g, ' ').trim();
            const parts = cleaned.split(/\s+/);
            if (parts.length === 3) {
                let m = -1, d = -1, y = -1;
                if (monthMap.hasOwnProperty(parts[0])) {
                    m = monthMap[parts[0]];
                    d = parseInt(parts[1], 10);
                    y = parseInt(parts[2], 10);
                } else if (monthMap.hasOwnProperty(parts[1])) {
                    d = parseInt(parts[0], 10);
                    m = monthMap[parts[1]];
                    y = parseInt(parts[2], 10);
                }
                if (m >= 0 && !isNaN(d) && !isNaN(y) && d >= 1 && d <= 31) {
                    const dt = new Date(0);
                    dt.setFullYear(y, m, d);
                    dt.setHours(0, 0, 0, 0);
                    if (dt.getMonth() === m) return { date: dt, isMonthOnly: false };
                }
            }
            return null;
        }

        function formatSheetDate(dateObj, isMonthOnly, rawFallback) {
            if (!dateObj) return rawFallback || "";
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            if (isMonthOnly) {
                return `${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
            }
            const m = dateObj.getMonth() + 1;
            const d = dateObj.getDate();
            const y = dateObj.getFullYear() < 1000 ? String(dateObj.getFullYear()).padStart(4, '0') : dateObj.getFullYear();
            return `${m}/${d}/${y}`;
        }

        function computeStatus(deathRaw) {
            if (!deathRaw || deathRaw.trim() === "") return "Alive";
            if (deathRaw.trim().toLowerCase() === "unverified") return "Limbo";
            return "Deceased";
        }

        function calculateSheetAge(birthIso, deathIso, status) {
            const birthDate = new Date(birthIso);
            const endDate = (status === "Deceased" && deathIso) ? new Date(deathIso) : new Date();
            if (isNaN(birthDate.getTime()) || birthDate > endDate) return { text: "Invalid", numericYears: 0 };

            let years = endDate.getFullYear() - birthDate.getFullYear();
            let months = endDate.getMonth() - birthDate.getMonth();
            let days = endDate.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const prevMonthDays = new Date(endDate.getFullYear(), endDate.getMonth(), 0).getDate();
                days += prevMonthDays;
            }
            if (months < 0) { years--; months += 12; }

            return {
                text: `${years} ${years === 1 ? 'year' : 'years'}`,
                numericYears: years + (months / 12) + (days / 365.25)
            };
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(peopleDataMap));
        }

        function getFormValidation() {
            const firstName = document.getElementById('form-first-name').value.trim();
            const lastName = document.getElementById('form-last-name').value.trim();
            const birthRaw = document.getElementById('form-birth-date').value.trim();
            const deathRaw = document.getElementById('form-death-date').value.trim();

            if (!firstName || !lastName || !activeGender || !birthRaw) return null;

            const parsedBirth = parseHistoricalDate(birthRaw);
            if (!parsedBirth || parsedBirth.date > new Date()) return null;

            let parsedDeath = null;
            const status = computeStatus(deathRaw);
            if (status === "Deceased") {
                parsedDeath = parseHistoricalDate(deathRaw);
                if (!parsedDeath || parsedDeath.date < parsedBirth.date || parsedDeath.date > new Date()) return null;
            }

            return {
                birthDateObj: parsedBirth.date,
                birthIsMonthOnly: parsedBirth.isMonthOnly,
                deathDateObj: parsedDeath ? parsedDeath.date : null,
                deathIsMonthOnly: parsedDeath ? parsedDeath.isMonthOnly : false,
                status
            };
        }

        function updateSubmitButtonState() {
            const btn = document.getElementById('submit-btn');
            const valid = !!getFormValidation();
            btn.disabled = !valid;
            btn.className = valid ? submitBtnEnabledClass : submitBtnDisabledClass;
        }

        document.getElementById('form-birth-date').addEventListener('input', function() {
            const preview = document.getElementById('birth-preview');
            if (!this.value.trim()) {
                preview.innerText = "";
            } else {
                const p = parseHistoricalDate(this.value);
                if (!p) {
                    preview.innerText = "Invalid date format";
                    preview.className = "text-[11px] text-red-400 font-mono italic h-4";
                } else {
                    preview.innerText = "Parsed: " + formatSheetDate(p.date, p.isMonthOnly);
                    preview.className = "text-[11px] text-cyan-400 font-mono italic h-4";
                }
            }
            updateSubmitButtonState();
        });

        document.getElementById('form-death-date').addEventListener('input', function() {
            const preview = document.getElementById('death-preview');
            const val = this.value.trim();
            if (!val) {
                preview.innerText = "Alive";
                preview.className = "text-[11px] text-emerald-400 font-mono italic h-4";
            } else if (val.toLowerCase() === "unverified") {
                preview.innerText = "Limbo (fill Last Verified)";
                preview.className = "text-[11px] text-amber-400 font-mono italic h-4";
            } else {
                const p = parseHistoricalDate(val);
                if (!p) {
                    preview.innerText = "Invalid death date";
                    preview.className = "text-[11px] text-red-400 font-mono italic h-4";
                } else {
                    preview.innerText = "Deceased (" + formatSheetDate(p.date, p.isMonthOnly) + ")";
                    preview.className = "text-[11px] text-slate-400 font-mono italic h-4";
                }
            }
            updateSubmitButtonState();
        });

        document.getElementById('set-unverified-btn').addEventListener('click', function() {
            const deathInput = document.getElementById('form-death-date');
            deathInput.value = "Unverified";
            deathInput.dispatchEvent(new Event('input'));
            document.getElementById('form-last-verified').focus();
        });

        ['f', 'm'].forEach(code => {
            const val = code.toUpperCase();
            document.getElementById(`gender-${code}`).addEventListener('click', function() {
                activeGender = (activeGender === val) ? "" : val;
                ['f', 'm'].forEach(c => {
                    const v = c.toUpperCase();
                    document.getElementById(`gender-${c}`).className = (activeGender === v) ? btnActiveStyle : btnInactiveStyle;
                });
                updateSubmitButtonState();
            });
        });

        ['form-first-name', 'form-middle-name', 'form-last-name', 'form-last-verified'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateSubmitButtonState);
        });

        function resetFormDefaults() {
            ['form-first-name', 'form-middle-name', 'form-last-name', 'form-birth-date', 'form-death-date', 'form-last-verified'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('birth-preview').innerText = '';
            document.getElementById('death-preview').innerText = 'Alive';
            document.getElementById('death-preview').className = 'text-[11px] text-slate-500 font-mono italic h-4';
            activeGender = "";
            ['f', 'm'].forEach(c => document.getElementById(`gender-${c}`).className = btnInactiveStyle);
            updateSubmitButtonState();
        }

        document.getElementById('submit-btn').addEventListener('click', function() {
            const validData = getFormValidation();
            if (!validData) return;

            const localKey = 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            peopleDataMap[localKey] = {
                firstName: document.getElementById('form-first-name').value.trim(),
                middleName: document.getElementById('form-middle-name').value.trim(),
                lastName: document.getElementById('form-last-name').value.trim(),
                gender: activeGender,
                birthIso: validData.birthDateObj.toISOString(),
                birthDisplay: formatSheetDate(validData.birthDateObj, validData.birthIsMonthOnly),
                deathIso: validData.deathDateObj ? validData.deathDateObj.toISOString() : null,
                deathDisplay: validData.status === "Limbo" ? "Unverified" : (validData.deathDateObj ? formatSheetDate(validData.deathDateObj, validData.deathIsMonthOnly) : ""),
                status: validData.status,
                lastVerified: validData.status === "Limbo" ? (document.getElementById('form-last-verified').value.trim() || "Unverified") : ""
            };
            saveToLocalStorage();
            renderTable();
            resetFormDefaults();
        });

        document.getElementById('purge-all-btn').addEventListener('click', function() {
            if (confirm("Are you sure you want to purge all entries from the database?")) {
                peopleDataMap = {};
                saveToLocalStorage();
                renderTable();
            }
        });

        document.getElementById('search-input').addEventListener('input', function() {
            searchQuery = this.value.trim().toLowerCase();
            document.getElementById('clear-search-btn').classList.toggle('hidden', !searchQuery);
            renderTable();
        });

        document.getElementById('clear-search-btn').addEventListener('click', function() {
            document.getElementById('search-input').value = "";
            searchQuery = "";
            this.classList.add('hidden');
            renderTable();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentFilter = this.getAttribute('data-filter');
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.className = (b === this)
                        ? "filter-btn px-2.5 py-1 rounded bg-cyan-900/60 text-cyan-200 font-bold"
                        : "filter-btn px-2.5 py-1 rounded text-slate-400 hover:text-slate-200";
                });
                renderTable();
            });
        });

        document.getElementById('sort-select').addEventListener('change', function() {
            currentSort = this.value;
            renderTable();
        });

        function handleCellFocus(key) { activelyEditingKey = key; }

        function handleNameSave(key, el) {
            const raw = el.innerText.trim();
            if (raw && peopleDataMap[key]) {
                const parts = raw.split(/\s+/);
                peopleDataMap[key].firstName = parts[0];
                peopleDataMap[key].middleName = parts.length > 2 ? parts.slice(1, -1).join(" ") : "";
                peopleDataMap[key].lastName = parts.length > 1 ? parts[parts.length - 1] : "";
                saveToLocalStorage();
            }
            activelyEditingKey = null;
            renderTable();
        }

        function handleBirthSave(key, el) {
            const raw = el.innerText.trim();
            const parsed = parseHistoricalDate(raw);
            if (parsed && peopleDataMap[key]) {
                peopleDataMap[key].birthIso = parsed.date.toISOString();
                peopleDataMap[key].birthDisplay = formatSheetDate(parsed.date, parsed.isMonthOnly);
                saveToLocalStorage();
            } else if (raw) {
                alert("Invalid birth date format.");
            }
            activelyEditingKey = null;
            renderTable();
        }

        function handleDeathSave(key, el) {
            const raw = el.innerText.trim();
            if (peopleDataMap[key]) {
                const status = computeStatus(raw);
                if (status === "Alive") {
                    peopleDataMap[key].deathIso = null;
                    peopleDataMap[key].deathDisplay = "";
                    peopleDataMap[key].status = "Alive";
                    peopleDataMap[key].lastVerified = "";
                } else if (status === "Limbo") {
                    peopleDataMap[key].deathIso = null;
                    peopleDataMap[key].deathDisplay = "Unverified";
                    peopleDataMap[key].status = "Limbo";
                    if (!peopleDataMap[key].lastVerified) peopleDataMap[key].lastVerified = "January 2026";
                } else {
                    const parsed = parseHistoricalDate(raw);
                    if (parsed) {
                        peopleDataMap[key].deathIso = parsed.date.toISOString();
                        peopleDataMap[key].deathDisplay = formatSheetDate(parsed.date, parsed.isMonthOnly);
                        peopleDataMap[key].status = "Deceased";
                        peopleDataMap[key].lastVerified = "";
                    } else {
                        alert("Invalid death date. Enter a valid date, 'Unverified', or leave blank for Alive.");
                    }
                }
                saveToLocalStorage();
            }
            activelyEditingKey = null;
            renderTable();
        }

        function handleVerifiedSave(key, el) {
            const raw = el.innerText.trim();
            if (peopleDataMap[key]) {
                peopleDataMap[key].lastVerified = raw;
                saveToLocalStorage();
            }
            activelyEditingKey = null;
            renderTable();
        }

        function toggleDropdownMenu(key, event) {
            event.stopPropagation();
            const menu = document.getElementById(`dropdown-${key}`);
            if (!menu) return;
            if (openDropdownKey === key) {
                menu.classList.remove('open');
                openDropdownKey = null;
            } else {
                if (openDropdownKey) {
                    const prev = document.getElementById(`dropdown-${openDropdownKey}`);
                    if (prev) prev.classList.remove('open');
                }
                menu.classList.add('open');
                openDropdownKey = key;
            }
        }

        function selectGenderOption(key, val) {
            if (peopleDataMap[key]) {
                peopleDataMap[key].gender = val;
                saveToLocalStorage();
                openDropdownKey = null;
                renderTable();
            }
        }

        document.addEventListener('click', function(e) {
            if (openDropdownKey) {
                const prev = document.getElementById(`dropdown-${openDropdownKey}`);
                if (prev) prev.classList.remove('open');
                openDropdownKey = null;
            }
            if (e.target && e.target.classList.contains('delete-btn')) {
                const key = e.target.getAttribute('data-key');
                if (confirm("Remove this person from the database?")) {
                    delete peopleDataMap[key];
                    saveToLocalStorage();
                    renderTable();
                }
            }
        });

        function updateBadges() {
            const entries = Object.values(peopleDataMap);
            document.getElementById('live-count-badge').innerText = entries.length;
            document.getElementById('alive-count-badge').innerText = entries.filter(e => e.status === "Alive").length;
            document.getElementById('limbo-count-badge').innerText = entries.filter(e => e.status === "Limbo").length;
        }

        function getStatusBadgeHtml(status) {
            if (status === "Alive") {
                return `<span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/65">Alive</span>`;
            }
            if (status === "Limbo") {
                return `<span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded bg-amber-950/80 text-amber-400 border border-amber-800/65">Limbo</span>`;
            }
            return `<span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded bg-slate-900 text-slate-400 border border-slate-700">Deceased</span>`;
        }

        function renderTable() {
            if (activelyEditingKey || openDropdownKey) return;
            updateBadges();
            const tableWrapper = document.getElementById('table-wrapper');
            const controlsWrapper = document.getElementById('controls-wrapper');
            const allKeys = Object.keys(peopleDataMap);
            
            if (allKeys.length === 0) {
                tableWrapper.classList.add('hidden');
                controlsWrapper.classList.add('hidden');
                controlsWrapper.classList.remove('flex');
                return;
            }
            
            tableWrapper.classList.remove('hidden');
            controlsWrapper.classList.remove('hidden');
            controlsWrapper.classList.add('flex');

            let items = allKeys.map(k => {
                const item = peopleDataMap[k];
                const fullName = [item.firstName, item.middleName, item.lastName].filter(Boolean).join(" ");
                const ageInfo = calculateSheetAge(item.birthIso, item.deathIso, item.status);
                return { localKey: k, ...item, fullName, ageInfo };
            });

            if (currentFilter !== "ALL") {
                items = items.filter(i => i.status === currentFilter);
            }

            if (searchQuery) {
                const queryTerms = searchQuery.split(/\s+/).filter(Boolean);
                items = items.filter(i => {
                    const searchableText = `${i.fullName} ${i.birthDisplay} ${i.deathDisplay} ${i.status}`.toLowerCase();
                    return queryTerms.every(term => searchableText.includes(term));
                });
            }

            items.sort((a, b) => {
                if (currentSort === "birth-asc") return new Date(a.birthIso) - new Date(b.birthIso);
                if (currentSort === "birth-desc") return new Date(b.birthIso) - new Date(a.birthIso);
                if (currentSort === "name-asc") return a.fullName.localeCompare(b.fullName);
                return 0;
            });

            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = items.map(item => `
                <tr id="row-${item.localKey}" class="hover:bg-slate-900/60 transition-colors text-xs border-b border-slate-800/80">
                    <td contenteditable="true"
                        onfocus="handleCellFocus('${item.localKey}')"
                        onblur="handleNameSave('${item.localKey}', this)"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); this.blur();}"
                        class="editable-cell px-4 py-3 font-medium text-slate-200 text-center border-r border-slate-800/80 cursor-edit">${item.fullName}</td>
                    <td class="px-2 py-3 text-center border-r border-slate-800/80 relative">
                        <div class="relative inline-block text-left w-12 mx-auto">
                            <button onclick="toggleDropdownMenu('${item.localKey}', event)" class="flex items-center justify-between w-full px-1.5 py-0.5 text-[10px] font-bold border border-slate-800 rounded bg-slate-950/60 text-slate-300 hover:bg-slate-800">
                                <span class="mx-auto">${item.gender}</span>
                                <svg class="w-2 h-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="dropdown-${item.localKey}" class="dropdown-menu absolute left-0 top-full w-full bg-slate-950 border border-slate-800 rounded-b shadow-xl z-50 py-0.5">
                                <button onclick="selectGenderOption('${item.localKey}', 'F')" class="block w-full text-center py-0.5 text-[10px] font-bold text-slate-400 hover:bg-slate-800">F</button>
                                <button onclick="selectGenderOption('${item.localKey}', 'M')" class="block w-full text-center py-0.5 text-[10px] font-bold text-slate-400 hover:bg-slate-800">M</button>
                            </div>
                        </div>
                    </td>
                    <td contenteditable="true"
                        onfocus="handleCellFocus('${item.localKey}')"
                        onblur="handleBirthSave('${item.localKey}', this)"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); this.blur();}"
                        class="editable-cell px-4 py-3 text-slate-400 text-center border-r border-slate-800/80 cursor-edit">${item.birthDisplay}</td>
                    <td contenteditable="true"
                        onfocus="handleCellFocus('${item.localKey}')"
                        onblur="handleDeathSave('${item.localKey}', this)"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); this.blur();}"
                        class="editable-cell px-4 py-3 ${item.status === 'Limbo' ? 'text-amber-400/90 italic' : 'text-slate-400'} text-center border-r border-slate-800/80 cursor-edit">${item.deathDisplay || '<span class="text-slate-600">—</span>'}</td>
                    <td class="px-4 py-3 text-cyan-400/90 font-semibold text-center border-r border-slate-800/80 select-none">${item.ageInfo.text}</td>
                    <td class="px-3 py-3 text-center border-r border-slate-800/80 select-none">${getStatusBadgeHtml(item.status)}</td>
                    <td contenteditable="true"
                        onfocus="handleCellFocus('${item.localKey}')"
                        onblur="handleVerifiedSave('${item.localKey}', this)"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); this.blur();}"
                        class="editable-cell px-4 py-3 text-amber-300/80 text-center border-r border-slate-800/80 cursor-edit">${item.lastVerified || '<span class="text-slate-700">—</span>'}</td>
                    <td class="px-3 py-3 text-center select-none">
                        <button type="button" data-key="${item.localKey}" class="delete-btn text-red-400 hover:text-red-300 font-bold bg-red-950/40 hover:bg-red-900/40 border border-red-900/30 px-2 py-0.5 rounded text-[11px]">Purge</button>
                    </td>
                </tr>
            `).join('');
        }

        // Standard RFC-compliant CSV parser for Google Sheets export
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentField.trim());
                    currentField = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentField.trim());
                    if (currentRow.some(cell => cell !== '')) {
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                if (currentRow.some(cell => cell !== '')) {
                    rows.push(currentRow);
                }
            }
            return rows;
        }

        // Fetch live data from the "People's Ages" tab in Google Sheets
        document.getElementById('load-sheet-btn').addEventListener('click', async function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Syncing Sheet...";

            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const csvText = await response.text();
                // Detect if Google redirected to a login HTML page (sheet isn't shared publicly)
                if (csvText.trim().startsWith('<!DOCTYPE html>') || csvText.includes('accounts.google.com')) {
                    throw new Error("AUTH_REQUIRED");
                }

                const rows = parseCSV(csvText);
                let headerIndex = rows.findIndex(r => r[0] && r[0].toUpperCase() === 'NAME');
                if (headerIndex === -1) headerIndex = 0;

                const dataRows = rows.slice(headerIndex + 1);
                let importedCount = 0;

                dataRows.forEach((row) => {
                    const fullName = (row[0] || "").trim();
                    const gender = (row[1] || "").trim().toUpperCase();
                    const birthRaw = (row[2] || "").trim();
                    const deathRaw = (row[3] || "").trim();
                    const sheetStatus = (row[5] || "").trim();

                    // Skip blank rows or the bottom helper "SEARCH / FIRST NAME / LAST NAME" block
                    if (!fullName || !birthRaw || fullName.toUpperCase() === 'SEARCH') return;

                    const pBirth = parseHistoricalDate(birthRaw);
                    if (!pBirth) return;

                    // Split full name into first, middle, last
                    const nameParts = fullName.split(/\s+/);
                    const firstName = nameParts[0];
                    const middleName = nameParts.length > 2 ? nameParts.slice(1, -1).join(" ") : "";
                    const lastName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : "";

                    let status = computeStatus(deathRaw);
                    if (sheetStatus === "Limbo") status = "Limbo";
                    const pDeath = status === "Deceased" ? parseHistoricalDate(deathRaw) : null;

                    // Deterministic key prevents duplicates when re-syncing the sheet
                    const slug = `${fullName}_${birthRaw}`.toLowerCase().replace(/[^a-z0-9]+/g, '_');
                    const key = `gsheet_${slug}`;

                    // Preserve any manually entered "lastVerified" note if this Limbo entry already existed
                    const existingVerified = peopleDataMap[key] ? peopleDataMap[key].lastVerified : "";

                    peopleDataMap[key] = {
                        firstName,
                        middleName,
                        lastName,
                        gender: (gender === 'F' || gender === 'M') ? gender : 'M',
                        birthIso: pBirth.date.toISOString(),
                        birthDisplay: formatSheetDate(pBirth.date, pBirth.isMonthOnly),
                        deathIso: pDeath ? pDeath.date.toISOString() : null,
                        deathDisplay: status === "Limbo" ? "Unverified" : (pDeath ? formatSheetDate(pDeath.date, pDeath.isMonthOnly) : ""),
                        status,
                        lastVerified: status === "Limbo" ? (existingVerified || "Unverified") : ""
                    };
                    importedCount++;
                });

                saveToLocalStorage();
                renderTable();

                btn.innerText = `✓ Synced ${importedCount} Entries`;
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 2200);

            } catch (err) {
                console.error("Google Sheet sync error:", err);
                if (err.message === "AUTH_REQUIRED") {
                    alert("Could not read the Google Sheet because it is private.\n\nIn Google Sheets, click Share → General access → 'Anyone with the link' (Viewer), then try again.");
                } else {
                    alert("Failed to pull data from Google Sheets. Make sure you have an internet connection and that the sheet is shared as 'Anyone with the link'.");
                }
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Dynamically sync sticky table header offset with the search/controls bar height
        const controlsEl = document.getElementById('controls-wrapper');
        const syncStickyOffset = () => {
            if (controlsEl && !controlsEl.classList.contains('hidden')) {
                document.documentElement.style.setProperty('--controls-height', `${controlsEl.offsetHeight}px`);
            }
        };
        new ResizeObserver(syncStickyOffset).observe(controlsEl);

        updateSubmitButtonState();
        renderTable();
        setInterval(renderTable, 1000);
    </script>
</body>
</html>
